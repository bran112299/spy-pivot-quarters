<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pivot Quarters</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0b0e14; color:#c9d1d9; font-family:monospace; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
#header { display:flex; align-items:center; gap:14px; padding:8px 14px; background:#0d1117; border-bottom:1px solid #1c2230; flex-shrink:0; flex-wrap:wrap; }
#header h1 { font-size:12px; font-weight:700; color:#58a6ff; letter-spacing:.1em; text-transform:uppercase; }
#price-label { font-size:13px; color:#c9d1d9; font-weight:500; }
.ctrl { display:flex; align-items:center; gap:5px; font-size:10px; color:#8b949e; }
select { background:#161b22; border:1px solid #30363d; color:#c9d1d9; border-radius:3px; padding:2px 5px; font-size:10px; cursor:pointer; }
input[type=checkbox] { accent-color:#58a6ff; cursor:pointer; }
#status { font-size:10px; color:#f0883e; margin-left:auto; }
#chart-wrap { flex:1; position:relative; overflow:hidden; min-height:0; }
#chart { position:absolute; inset:0; width:100%; height:100%; }
#fib-dots { position:absolute; inset:0; pointer-events:none; z-index:8; }
.fib-dot { position:absolute; width:11px; height:11px; transform:translate(-50%,-50%); border-radius:50%; border:2px solid rgba(255,255,255,0.9); box-shadow:0 0 0 1px rgba(0,0,0,0.45); display:none; }
.fib-dot.hi { background:#f85149; }
.fib-dot.lo { background:#3fb950; }
#info { position:absolute; top:10px; left:10px; z-index:10; background:rgba(11,14,20,0.93); border:1px solid #1c2230; border-radius:5px; padding:8px 11px; font-size:10px; line-height:2; min-width:148px; pointer-events:none; }
.ir { display:flex; justify-content:space-between; gap:12px; }
.il { color:#6e7681; }
.iv { color:#c9d1d9; }
.p  { color:#58a6ff; }
.r  { color:#f85149; }
.s  { color:#3fb950; }
.qu { color:rgba(190,150,255,0.95); }
.qd { color:rgba(100,200,255,0.95); }
#legend { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:4px 14px; background:#0b0e14; border-top:1px solid #1c2230; font-size:9px; color:#6e7681; flex-shrink:0; }
.leg { display:flex; align-items:center; gap:4px; }
.ld { width:16px; height:2px; border-radius:1px; }
</style>
</head>
<body>

<div id="header">
  <h1>Pivot Quarters</h1><span style="font-size:9px;color:#6e7681;font-weight:400;margin-left:6px">pinned swings</span>
  <span id="price-label">SPY —</span>
  <div class="ctrl"><label>Pivot</label>
    <select id="pivTf">
      <option value="monthly" selected>Monthly</option>
      <option value="weekly">Weekly</option>
    </select>
  </div>
  <div class="ctrl"><label>Quarters</label><input type="checkbox" id="showQ" checked></div>
  <div class="ctrl"><label>Pivots</label><input type="checkbox" id="showP" checked></div>
  <div class="ctrl"><label>Nodes</label><input type="checkbox" id="showNodes" checked></div>
  <div class="ctrl"><label>R2/S2</label><input type="checkbox" id="showR2" checked></div>
  <span id="status">Initializing...</span>
</div>

<div id="chart-wrap">
  <div id="chart"></div>
  <div id="fib-dots" aria-hidden="true">
    <div class="fib-dot hi" id="fib-dot-hi" title="SwH: prior H until broken, then period high"></div>
    <div class="fib-dot lo" id="fib-dot-lo" title="SwL: prior L until broken, then period low"></div>
  </div>
  <div id="info">
    <div class="ir"><span class="il">P</span>    <span class="iv p"  id="iP">—</span></div>
    <div class="ir"><span class="il">R1</span>   <span class="iv r"  id="iR1">—</span></div>
    <div class="ir"><span class="il">S1</span>   <span class="iv s"  id="iS1">—</span></div>
    <div class="ir"><span class="il">SwH</span>  <span class="iv r"  id="iSH">—</span></div>
    <div class="ir"><span class="il">SwL</span>  <span class="iv s"  id="iSL">—</span></div>
    <div class="ir"><span class="il">Q75u</span> <span class="iv qu" id="iQ75u">—</span></div>
    <div class="ir"><span class="il">Q50u</span> <span class="iv qu" id="iQ50u">—</span></div>
    <div class="ir"><span class="il">Q25u</span> <span class="iv qu" id="iQ25u">—</span></div>
    <div class="ir"><span class="il">Q25d</span> <span class="iv qd" id="iQ25d">—</span></div>
    <div class="ir"><span class="il">Q50d</span> <span class="iv qd" id="iQ50d">—</span></div>
    <div class="ir"><span class="il">Q75d</span> <span class="iv qd" id="iQ75d">—</span></div>
  </div>
</div>

<div id="legend">
  <div class="leg"><div class="ld" style="background:#58a6ff"></div>P</div>
  <div class="leg"><div class="ld" style="background:#f85149"></div>R1</div>
  <div class="leg"><div class="ld" style="background:#3fb950"></div>S1</div>
  <div class="leg"><div class="ld" style="background:rgba(248,81,73,0.4)"></div>R2</div>
  <div class="leg"><div class="ld" style="background:rgba(63,185,80,0.4)"></div>S2</div>
  <div class="leg"><div class="ld" style="background:rgba(190,150,255,0.85)"></div>Q up</div>
  <div class="leg"><div class="ld" style="background:rgba(100,200,255,0.85)"></div>Q down</div>
  <div class="leg"><div class="ld" style="background:rgba(100,80,180,0.4)"></div>Prior P</div>
  <div class="leg"><div class="ld" style="background:#f85149; border-radius:50%; width:8px; height:8px"></div>SwH (prior H → break)</div>
  <div class="leg"><div class="ld" style="background:#3fb950; border-radius:50%; width:8px; height:8px"></div>SwL (prior L → break)</div>
</div>

<script>
(function() {

  var allBars = [];
  var periods = [];
  var chart, candleSeries, pool;

  var CACHE_KEY = 'pivot_quarters_spy_1d_v1';

  function status(msg) {
    document.getElementById('status').textContent = msg;
  }

  /** Same 4.1.3 build everywhere: local file first (works offline / if CDNs blocked), then CDNs. */
  var CHART_LIB_SOURCES = [
    'lightweight-charts.standalone.production.js',
    'https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js',
    'https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js',
    'https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js'
  ];

  function loadChartLibrary(i) {
    if (i >= CHART_LIB_SOURCES.length) {
      status('Failed to load chart library');
      return;
    }
    var src = CHART_LIB_SOURCES[i];
    if (i > 0) status('Loading chart library…');
    var s = document.createElement('script');
    s.src = src;
    s.onload = initChart;
    s.onerror = function() { loadChartLibrary(i + 1); };
    document.head.appendChild(s);
  }

  function initChart() {
    chart = LightweightCharts.createChart(document.getElementById('chart'), {
      layout: { background: { color: '#0b0e14' }, textColor: '#8b949e' },
      grid:   { vertLines: { color: '#111620' }, horzLines: { color: '#111620' } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      rightPriceScale: { borderColor: '#1c2230' },
      timeScale: { borderColor: '#1c2230', timeVisible: true },
      handleScroll: true,
      handleScale: true,
    });

    candleSeries = chart.addCandlestickSeries({
      upColor: '#3fb950', downColor: '#f85149',
      borderUpColor: '#3fb950', borderDownColor: '#f85149',
      wickUpColor: '#3fb950', wickDownColor: '#f85149',
    });

    pool = [];

    chart.subscribeCrosshairMove(onCrosshair);

    document.getElementById('pivTf').addEventListener('change', draw);
    document.getElementById('showQ').addEventListener('change', draw);
    document.getElementById('showP').addEventListener('change', draw);
    document.getElementById('showNodes').addEventListener('change', draw);
    document.getElementById('showR2').addEventListener('change', draw);

    loadData();
  }

  // ── Data ─────────────────────────────────────────────────────────

  function yahooChartUrl() {
    var now  = Math.floor(Date.now() / 1000);
    var from = now - 5 * 365 * 86400;
    return 'https://query1.finance.yahoo.com/v8/finance/chart/SPY?period1=' + from + '&period2=' + now + '&interval=1d&includePrePost=false';
  }

  function barsFromYahooJson(json) {
    if (!json || !json.chart || !json.chart.result || !json.chart.result[0]) {
      throw new Error('Unexpected Yahoo response');
    }
    var result = json.chart.result[0];
    var ts     = result.timestamp;
    var q      = result.indicators.quote[0];
    var bars   = [];
    for (var i = 0; i < ts.length; i++) {
      if (q.open[i] == null || q.high[i] == null || q.low[i] == null || q.close[i] == null) continue;
      bars.push({
        time:  ts[i],
        open:  Math.round(q.open[i]  * 100) / 100,
        high:  Math.round(q.high[i]  * 100) / 100,
        low:   Math.round(q.low[i]   * 100) / 100,
        close: Math.round(q.close[i] * 100) / 100,
      });
    }
    if (!bars.length) throw new Error('No OHLC rows');
    bars.sort(function(a, b) { return a.time - b.time; });
    return bars;
  }

  /** Try to get Yahoo JSON text: raw body, or allorigins { contents } wrapper. */
  function parseYahooPayload(text) {
    var t = text.trim();
    if (t.charAt(0) === '{') {
      var outer = JSON.parse(t);
      if (outer.contents != null && typeof outer.contents === 'string') {
        return JSON.parse(outer.contents);
      }
      return outer;
    }
    throw new Error('Not JSON');
  }

  function fetchTextTimed(url, ms) {
    var ctrl = new AbortController();
    var timer = setTimeout(function() { ctrl.abort(); }, ms || 25000);
    return fetch(url, { cache: 'no-store', signal: ctrl.signal })
      .finally(function() { clearTimeout(timer); })
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      });
  }

  function fetchYahooThroughProxies() {
    var yahoo = yahooChartUrl();
    var enc   = encodeURIComponent(yahoo);
    /* Raw + get are the reliable allOrigins modes; other public proxies often 403/rate-limit. */
    var urls  = [
      { u: 'https://api.allorigins.win/raw?url=' + enc, label: 'allorigins' },
      { u: 'https://api.allorigins.win/get?url=' + enc, label: 'allorigins+json' },
      { u: yahoo, label: 'direct' },
    ];

    function tryIndex(i) {
      if (i >= urls.length) {
        return Promise.reject(new Error('Failed to fetch'));
      }
      status('Fetching SPY… (' + urls[i].label + ')');
      return fetchTextTimed(urls[i].u, 25000)
        .then(function(text) {
          return barsFromYahooJson(parseYahooPayload(text));
        })
        .catch(function() { return tryIndex(i + 1); });
    }
    return tryIndex(0);
  }

  /** When fetch() fails (some file:// / privacy modes), JSONP via <script> can still work. */
  function fetchYahooJsonp() {
    var yahoo = yahooChartUrl();
    var enc   = encodeURIComponent(yahoo);
    return new Promise(function(resolve, reject) {
      var cbName = '_pq_ao_' + String(Date.now()) + '_' + Math.floor(Math.random() * 1e6);
      var script = document.createElement('script');
      var done = false;
      var timer = setTimeout(function() {
        if (done) return;
        done = true;
        cleanup();
        reject(new Error('JSONP timeout'));
      }, 35000);
      function cleanup() {
        clearTimeout(timer);
        try { delete window[cbName]; } catch (e) {}
        if (script.parentNode) script.parentNode.removeChild(script);
      }
      window[cbName] = function(wrapper) {
        if (done) return;
        done = true;
        cleanup();
        try {
          if (!wrapper || wrapper.contents == null) throw new Error('Bad JSONP payload');
          var json = JSON.parse(wrapper.contents);
          resolve(barsFromYahooJson(json));
        } catch (err) {
          reject(err);
        }
      };
      script.onerror = function() {
        if (done) return;
        done = true;
        cleanup();
        reject(new Error('JSONP script error'));
      };
      script.src = 'https://api.allorigins.win/get?callback=' + cbName + '&url=' + enc;
      document.head.appendChild(script);
    });
  }

  function readCache() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || !Array.isArray(o.bars) || !o.bars.length) return null;
      return o;
    } catch (e) {
      return null;
    }
  }

  function writeCache(bars) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        v: 1,
        saved: Date.now(),
        bars: bars,
      }));
    } catch (e) { /* quota / private mode */ }
  }

  function applyBars(bars, msg) {
    allBars = bars;
    candleSeries.setData(allBars);
    draw();
    chart.timeScale().fitContent();
    status(msg);
  }

  function loadData() {
    var cached = readCache();
    var hadCache = !!(cached && cached.bars && cached.bars.length);
    if (hadCache) {
      applyBars(cached.bars, cached.bars.length + ' bars (cached) · refreshing…');
    } else {
      status('Fetching SPY…');
    }

    fetchYahooThroughProxies()
      .catch(function() {
        if (!hadCache) status('Fetching SPY… (jsonp fallback)');
        return fetchYahooJsonp();
      })
      .then(function(bars) {
        writeCache(bars);
        applyBars(bars, bars.length + (hadCache ? ' bars (updated)' : ' bars loaded'));
      })
      .catch(function() {
        if (!hadCache) {
          status('Error: Failed to fetch SPY data. Serve this folder over HTTP (e.g. python3 -m http.server), open localhost, and pause ad blockers / strict tracking protection.');
        } else {
          status(cached.bars.length + ' bars (cached · refresh failed)');
        }
      });
  }

  // ── Pivot grouping ────────────────────────────────────────────────

  function getPivotKey(ts, mode) {
    var d = new Date(ts * 1000);
    if (mode === 'monthly') {
      return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0');
    }
    var day = d.getUTCDay() || 7;
    var mon = new Date(d);
    mon.setUTCDate(d.getUTCDate() - day + 1);
    return mon.toISOString().slice(0, 10);
  }

  function groupPeriods(bars, mode) {
    var map = {};
    var order = [];
    for (var i = 0; i < bars.length; i++) {
      var b = bars[i];
      var k = getPivotKey(b.time, mode);
      if (!map[k]) {
        map[k] = { key: k, firstTime: b.time, high: b.high, low: b.low, close: b.close, bars: [] };
        order.push(k);
      }
      var p = map[k];
      if (b.high > p.high) p.high = b.high;
      if (b.low  < p.low)  p.low  = b.low;
      p.close = b.close;
      p.bars.push(b);
    }
    return order.map(function(k) { return map[k]; });
  }

  // ── Math ──────────────────────────────────────────────────────────

  function calcLevels(H, L, C) {
    var P = (H + L + C) / 3;
    return { P: P, R1: 2*P - L, S1: 2*P - H, R2: P + (H-L), S2: P - (H-L) };
  }

  function quarters(P, swH, swL) {
    var up   = swH - P;
    var down = P   - swL;
    return {
      u75: P + 0.75 * up,   u50: P + 0.50 * up,   u25: P + 0.25 * up,
      d25: P - 0.25 * down, d50: P - 0.50 * down, d75: P - 0.75 * down,
    };
  }

  /**
   * Quarter-band swings: pin swH to prior period high and swL to prior period low until each side
   * breaks (trade above prior high / below prior low). Until then that side stays pinned; after
   * break it follows the running high or low of the current period. Both sides update independently.
   */
  function pinnedSwingsThroughTime(prevPeriod, currBars, timeCutoff) {
    var releasedHigh = false;
    var releasedLow  = false;
    var runningHi = -Infinity;
    var runningLo = Infinity;
    for (var i = 0; i < currBars.length; i++) {
      var b = currBars[i];
      if (timeCutoff != null && b.time > timeCutoff) break;
      if (b.high > runningHi) runningHi = b.high;
      if (b.low < runningLo) runningLo = b.low;
      if (!releasedHigh && b.high > prevPeriod.high) releasedHigh = true;
      if (!releasedLow && b.low < prevPeriod.low) releasedLow = true;
    }
    var swH = releasedHigh ? runningHi : prevPeriod.high;
    var swL = releasedLow ? runningLo : prevPeriod.low;
    return { swH: swH, swL: swL };
  }

  // ── Series ────────────────────────────────────────────────────────

  function clearPool() {
    for (var i = 0; i < pool.length; i++) {
      try { chart.removeSeries(pool[i]); } catch(e) {}
    }
    pool = [];
  }

  function line(color, width, style, title, excludeFromAutoscale) {
    var opts = {
      color: color,
      lineWidth: width,
      lineStyle: style !== undefined ? style : LightweightCharts.LineStyle.Solid,
      priceLineVisible: false,
      lastValueVisible: !!title,
      title: title || '',
      crosshairMarkerVisible: false,
    };
    if (excludeFromAutoscale) {
      opts.autoscaleInfoProvider = function() { return null; };
    }
    var s = chart.addLineSeries(opts);
    pool.push(s);
    return s;
  }

  // ── Draw ──────────────────────────────────────────────────────────

  function draw() {
    clearPool();
    if (!allBars.length) return;

    var mode    = document.getElementById('pivTf').value;
    var showQ   = document.getElementById('showQ').checked;
    var showPiv = document.getElementById('showP').checked;
    var showNod = document.getElementById('showNodes').checked;
    var showR2  = document.getElementById('showR2').checked;
    var LS      = LightweightCharts.LineStyle;

    periods = groupPeriods(allBars, mode);

    var sP  = showPiv ? line('#58a6ff',             2, LS.Solid, 'P')   : null;
    var sR1 = showPiv ? line('rgba(248,81,73,0.9)', 1, LS.Solid, 'R1')  : null;
    var sS1 = showPiv ? line('rgba(63,185,80,0.9)', 1, LS.Solid, 'S1')  : null;
    var sR2 = (showPiv && showR2) ? line('rgba(248,81,73,0.4)', 1, LS.Solid, 'R2') : null;
    var sS2 = (showPiv && showR2) ? line('rgba(63,185,80,0.4)',  1, LS.Solid, 'S2') : null;

    var sQu75, sQu50, sQu25, sQd25, sQd50, sQd75;
    if (showQ) {
      sQu75 = line('rgba(190,150,255,0.9)',  1, LS.Dashed, 'Q75u');
      sQu50 = line('rgba(190,150,255,0.65)', 1, LS.Dashed, 'Q50u');
      sQu25 = line('rgba(190,150,255,0.4)',  1, LS.Dashed, 'Q25u');
      sQd25 = line('rgba(100,200,255,0.4)',  1, LS.Dashed, 'Q25d');
      sQd50 = line('rgba(100,200,255,0.65)', 1, LS.Dashed, 'Q50d');
      sQd75 = line('rgba(100,200,255,0.9)',  1, LS.Dashed, 'Q75d');
    }

    var dP=[],dR1=[],dS1=[],dR2=[],dS2=[];
    var dQu75=[],dQu50=[],dQu25=[],dQd25=[],dQd50=[],dQd75=[];
    var histP = [];

    for (var pi = 1; pi < periods.length; pi++) {
      var prev = periods[pi - 1];
      var curr = periods[pi];
      var lv   = calcLevels(prev.high, prev.low, prev.close);
      histP.push(lv.P);

      var relH = false, relL = false;
      var runHi = -Infinity, runLo = Infinity;
      for (var bi = 0; bi < curr.bars.length; bi++) {
        var bar = curr.bars[bi];
        if (bar.high > runHi) runHi = bar.high;
        if (bar.low < runLo) runLo = bar.low;
        if (!relH && bar.high > prev.high) relH = true;
        if (!relL && bar.low < prev.low) relL = true;
        var swH = relH ? runHi : prev.high;
        var swL = relL ? runLo : prev.low;
        var t = bar.time;

        if (showPiv) {
          dP.push({time:t,  value:lv.P});
          dR1.push({time:t, value:lv.R1});
          dS1.push({time:t, value:lv.S1});
          if (showR2) { dR2.push({time:t, value:lv.R2}); dS2.push({time:t, value:lv.S2}); }
        }
        if (showQ) {
          var q = quarters(lv.P, swH, swL);
          dQu75.push({time:t,value:q.u75}); dQu50.push({time:t,value:q.u50}); dQu25.push({time:t,value:q.u25});
          dQd25.push({time:t,value:q.d25}); dQd50.push({time:t,value:q.d50}); dQd75.push({time:t,value:q.d75});
        }
      }
    }

    if (showPiv) {
      sP.setData(dP); sR1.setData(dR1); sS1.setData(dS1);
      if (showR2) { sR2.setData(dR2); sS2.setData(dS2); }
    }
    if (showQ) {
      sQu75.setData(dQu75); sQu50.setData(dQu50); sQu25.setData(dQu25);
      sQd25.setData(dQd25); sQd50.setData(dQd50); sQd75.setData(dQd75);
    }

    if (showNod && histP.length && periods.length > 1) {
      /* Prior P for period[ni] is active only from period[ni+1].firstTime forward (no left/future leak). */
      var firstNodeT = periods[1].firstTime;
      for (var ni = 0; ni < histP.length; ni++) {
        var pv = histP[ni];
        var startT = periods[ni + 1].firstTime;
        var seg = [];
        for (var bi = 0; bi < allBars.length; bi++) {
          var bt = allBars[bi].time;
          if (bt >= startT) seg.push({ time: bt, value: pv });
        }
        var ns = line('rgba(100,80,180,0.3)', 1, LS.Dotted, '', true);
        ns.setData(seg);
      }
      var mn = Math.min.apply(null, histP);
      var mx = Math.max.apply(null, histP);
      var env = [];
      for (var ei = 0; ei < allBars.length; ei++) {
        var et = allBars[ei].time;
        if (et >= firstNodeT) env.push({ time: et, value: mx });
      }
      line('rgba(120,100,200,0.12)', 1, LS.Solid, '', true).setData(env);
      env = [];
      for (var ej = 0; ej < allBars.length; ej++) {
        var et2 = allBars[ej].time;
        if (et2 >= firstNodeT) env.push({ time: et2, value: mn });
      }
      line('rgba(120,100,200,0.12)', 1, LS.Solid, '', true).setData(env);
    }
  }

  // ── Crosshair ─────────────────────────────────────────────────────

  function hideFibDots() {
    var hi = document.getElementById('fib-dot-hi');
    var lo = document.getElementById('fib-dot-lo');
    if (hi) hi.style.display = 'none';
    if (lo) lo.style.display = 'none';
  }

  function onCrosshair(param) {
    var bar = param && param.seriesData && param.seriesData.get(candleSeries);
    if (bar && bar.close != null) {
      document.getElementById('price-label').textContent = 'SPY ' + bar.close.toFixed(2);
    }

    if (!param || !param.time || !periods.length) {
      hideFibDots();
      return;
    }

    var mode = document.getElementById('pivTf').value;
    var key  = getPivotKey(param.time, mode);
    var idx  = -1;
    for (var i = 0; i < periods.length; i++) {
      if (periods[i].key === key) { idx = i; break; }
    }
    if (idx < 1) {
      hideFibDots();
      return;
    }

    var prev = periods[idx - 1];
    var curr = periods[idx];
    var lv   = calcLevels(prev.high, prev.low, prev.close);

    var ps = pinnedSwingsThroughTime(prev, curr.bars, param.time);
    var swH = ps.swH;
    var swL = ps.swL;

    var q = quarters(lv.P, swH, swL);
    var f = function(v) { return v.toFixed(2); };

    document.getElementById('iP').textContent    = f(lv.P);
    document.getElementById('iR1').textContent   = f(lv.R1);
    document.getElementById('iS1').textContent   = f(lv.S1);
    document.getElementById('iSH').textContent   = f(swH);
    document.getElementById('iSL').textContent   = f(swL);
    document.getElementById('iQ75u').textContent = f(q.u75);
    document.getElementById('iQ50u').textContent = f(q.u50);
    document.getElementById('iQ25u').textContent = f(q.u25);
    document.getElementById('iQ25d').textContent = f(q.d25);
    document.getElementById('iQ50d').textContent = f(q.d50);
    document.getElementById('iQ75d').textContent = f(q.d75);

    var x = chart.timeScale().timeToCoordinate(param.time);
    var yHi = candleSeries.priceToCoordinate(swH);
    var yLo = candleSeries.priceToCoordinate(swL);
    var dotHi = document.getElementById('fib-dot-hi');
    var dotLo = document.getElementById('fib-dot-lo');
    if (x == null || yHi == null || yLo == null || !dotHi || !dotLo) {
      hideFibDots();
      return;
    }
    dotHi.style.display = 'block';
    dotLo.style.display = 'block';
    dotHi.style.left = x + 'px';
    dotHi.style.top = yHi + 'px';
    dotLo.style.left = x + 'px';
    dotLo.style.top = yLo + 'px';
  }

  // ── Boot ──────────────────────────────────────────────────────────

  loadChartLibrary(0);

})();
</script>
