<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chart Viewer &mdash; Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d1117; color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; align-items: center; justify-content: center;
    height: 100vh;
  }
  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 10px;
    padding: 36px 40px; width: 420px; display: flex; flex-direction: column; gap: 18px;
  }
  h1 { font-size: 18px; font-weight: 700; text-align: center; }
  label { font-size: 12px; color: #8b949e; display: block; margin-bottom: 6px; }
  textarea {
    width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
    color: #e6edf3; font-size: 11px; font-family: monospace; padding: 8px 12px;
    outline: none; resize: vertical; transition: border-color .15s;
  }
  textarea:focus { border-color: #388bfd; }
  button {
    width: 100%; background: #238636; border: none; border-radius: 6px;
    color: #fff; font-size: 13px; font-weight: 600; padding: 9px;
    cursor: pointer; transition: background .15s;
  }
  button:hover    { background: #2ea043; }
  button:disabled { background: #1a4024; color: #6e7681; cursor: default; }
  .hint {
    font-size: 11px; color: #8b949e; line-height: 1.7;
    background: rgba(56,139,253,.08); border: 1px solid #388bfd33;
    border-radius: 6px; padding: 10px 12px;
  }
  .hint b { color: #e6edf3; }
  .hint a { color: #388bfd; }
  .hint code { color: #e6edf3; background: #0d1117; padding: 1px 4px; border-radius: 3px; }
  #msg { font-size: 12px; text-align: center; padding: 8px 12px; border-radius: 6px; display: none; }
  #msg.err { background: rgba(248,81,73,.15); border: 1px solid #da3633; color: #f85149; display: block; }
  #msg.ok  { background: rgba(63,185,80,.15);  border: 1px solid #238636; color: #3fb950; display: block; }
</style>
</head>
<body>
<div class="card">
  <h1>TradingView Login</h1>
  <div class="hint">
    <b>How to get your cookies:</b><br>
    1. Log in at <a href="https://www.tradingview.com" target="_blank">tradingview.com</a><br>
    2. Open DevTools (F12) &rarr; Network &rarr; reload the page<br>
    3. Click any request to <code>tradingview.com</code> &rarr; Headers<br>
    4. Find <b>Cookie:</b> and copy the entire value
  </div>
  <div>
    <label for="cookies">Cookie header value</label>
    <textarea id="cookies" rows="4" placeholder="Paste full cookie string here..." autocomplete="off" spellcheck="false"></textarea>
  </div>
  <div id="msg"></div>
  <button id="btn" onclick="doLogin()">Sign In</button>
</div>
<script>
  async function doLogin() {
    const cookies = document.getElementById('cookies').value.trim();
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');
    if (!cookies) { msg.className = 'err'; msg.textContent = 'Paste your cookies first.'; return; }
    btn.disabled = true; btn.textContent = 'Signing in...';
    msg.className = '';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cookies }),
      });
      const json = await res.json();
      if (json.ok) {
        msg.className = 'ok'; msg.textContent = 'Authenticated! Redirecting...';
        setTimeout(() => window.location.href = '/', 800);
      } else {
        msg.className = 'err'; msg.textContent = json.error || 'Login failed.';
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    } catch (e) {
      msg.className = 'err'; msg.textContent = 'Network error -- is the server running?';
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  }
</script>
</body>
</html>
